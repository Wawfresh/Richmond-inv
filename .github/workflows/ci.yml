name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript lint check
        run: npm run lint

      - name: Production build (Vite + Express bundle)
        run: npm run build

      - name: Verify production bundle outputs
        run: |
          test -f dist/index.html
          test -f dist/RICHMOND-INV-Project-Overview.pdf
          test -f server.js
