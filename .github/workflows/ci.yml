name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: TypeScript lint check
        run: npm run lint

      - name: Build and package for Namecheap
        run: npm run package:namecheap

      - name: Verify production outputs
        run: |
          test -f deploy-dist/public_html/index.html
          test -f deploy-dist/public_html/.htaccess
          test -f deploy-dist/public_html/RICHMOND-INV-Project-Overview.pdf
          test -f deploy-dist/richmond-inv-app/server.js
          test -f deploy-dist/richmond-inv-app/package.json

      - name: Upload Namecheap deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: richmond-inv-namecheap-package
          path: deploy-dist/
          include-hidden-files: true
          retention-days: 14
